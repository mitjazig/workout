<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Izziv 10 – 10-dnevni vadbeni izziv doma, brez opreme" />
    <title>Izziv 10 – Vadbe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var mode = localStorage.getItem('izziv-10:theme');
        var dark;
        if (mode === 'light') dark = false;
        else if (mode === 'dark') dark = true;
        else if (mode === 'auto' || mode === null) {
          var h = new Date().getHours();
          dark = h >= 18 || h < 6;
          if (mode === null) {
            var legacy = localStorage.getItem('izziv-10:dark-mode') ?? localStorage.getItem('tai-chi:dark-mode');
            if (legacy === 'true') dark = true;
            else if (legacy === 'false') dark = false;
          }
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
